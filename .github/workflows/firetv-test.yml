name: Fire TV test build
# Test channel for changes that are not yet approved: builds the APK from the firetv-next branch,
# publishes it as the separate "firetv-test" pre-release (the in-app updater never looks there),
# and takes screenshots on an Android TV emulator, pushed to the ci-screenshots branch.
on:
  push:
    branches: [firetv-next]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firetv-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Use the stable debug key
        env:
          FIRETV_DEBUG_KEYSTORE_BASE64: ${{ secrets.FIRETV_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FIRETV_DEBUG_KEYSTORE_BASE64" ]; then
            key="$RUNNER_TEMP/firetv-debug.keystore"
            printf '%s' "$FIRETV_DEBUG_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$key"
            echo "FIRETV_DEBUG_KEYSTORE=$key" >> "$GITHUB_ENV"
          fi
      - name: Unit tests and debug APK
        env:
          FIRETV_BUILD: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Publish firetv-test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sva-firetv-test.apk
          gh release delete firetv-test --yes --cleanup-tag || true
          gh release create firetv-test sva-firetv-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Sva PRUEBAS ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "Versión de pruebas, no se ofrece como actualización. Instalar a mano solo para probar."
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshots on an Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./scripts/ci-screenshots.sh
      - name: Push screenshots to the ci-screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          dir="$RUNNER_TEMP/shots-repo"; mkdir -p "$dir"; cp -r shots/. "$dir/"
          cd "$dir"
          printf 'sha=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > INFO.txt
          git init -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots for ${GITHUB_SHA::7}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -qf "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screenshots
      - name: Fail if the app crashed
        run: '! test -f shots/CRASHED'
