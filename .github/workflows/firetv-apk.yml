name: Fire TV APK
# Builds a debug APK of the Fire TV branch and publishes it as the "firetv-latest" pre-release,
# so the Downloader app on a Fire TV can install it from a fixed URL:
#   https://github.com/<owner>/sva-launcher/releases/download/firetv-latest/sva-firetv.apk
on:
  push:
    branches: [firetv]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firetv-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Use a stable debug key when one is configured
        # Optional secret: base64 of a debug keystore (alias androiddebugkey, password android).
        # Without it every build gets a new key and updating requires uninstalling Sva first.
        env:
          FIRETV_DEBUG_KEYSTORE_BASE64: ${{ secrets.FIRETV_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$FIRETV_DEBUG_KEYSTORE_BASE64" ]; then
            key="$RUNNER_TEMP/firetv-debug.keystore"
            printf '%s' "$FIRETV_DEBUG_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$key"
            echo "FIRETV_DEBUG_KEYSTORE=$key" >> "$GITHUB_ENV"
            echo "Stable debug key installed ($(wc -c < "$key") bytes)."
            keytool -list -keystore "$key" -storepass android | grep -i fingerprint || true
          else
            echo "::notice::No FIRETV_DEBUG_KEYSTORE_BASE64 secret; using a one-off debug key."
          fi
      - name: Build debug APK
        env:
          FIRETV_BUILD: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish firetv-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sva-firetv.apk
          # What changed since the stable release being replaced: commit subjects, without CI-only ones.
          gh release download firetv-latest -p version.json -O previous.json 2>/dev/null || echo '{}' > previous.json
          prev=$(python3 -c 'import json;print(json.load(open("previous.json")).get("sha",""))')
          if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null; then
            git log --no-merges --format=%s "$prev..$GITHUB_SHA" | grep -v '^CI:' > changes.txt || true
          else
            : > changes.txt
          fi
          # Read by the in-app updater (must match versionCode in app/build.gradle).
          python3 - "$((100 + 2 * GITHUB_RUN_NUMBER))" "4.0.1-firetv.$GITHUB_RUN_NUMBER" "$GITHUB_SHA" <<'PY' > version.json
          import json, sys
          lines = [l.strip() for l in open("changes.txt", encoding="utf-8") if l.strip()]
          print(json.dumps({"versionCode": int(sys.argv[1]), "versionName": sys.argv[2], "sha": sys.argv[3],
                            "changes": lines[:8]}, ensure_ascii=False))
          PY
          cat version.json
          gh release delete firetv-latest --yes --cleanup-tag || true
          gh release create firetv-latest sva-firetv.apk version.json \
            --prerelease --target "$GITHUB_SHA" \
            --title "Sva para Fire TV ($(date -u +%Y-%m-%d) · ${GITHUB_SHA::7})" \
            --notes "APK de pruebas para Fire TV generado automáticamente desde la rama firetv."
